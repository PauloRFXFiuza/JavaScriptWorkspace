<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Buscador de CEP</title>
        
        <style>
            header{
                padding: 20px;
                font-size: 14px;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                text-align: left;
                color: rgb(209, 167, 247);
            }
            body{
                text-align: center;
                background-color: rgb(49, 49, 49);
                color: rgb(209, 167, 247);
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            ::placeholder{
                color: rgb(209, 167, 247);
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-weight: 600;
            }
            button{
                background-color: rgb(242, 190, 243);
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                border-radius:5px 5px 20px 5px;
                padding:8px; 
                width:150px;
                font-size:18px;
                font-weight: bold;
                cursor: pointer;
            }
            #cep{
                border-radius:20px 5px 5px 5px; 
                padding:15px; 
                width:40vh; 
                font-size:18px; 
                font-weight: 600;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color: black; 
                color:rgb(159, 60, 252);
            }
        </style>
        
    </head>
    <header>
        <p id="data">A</p>    
    </header>

    <body>

        <h1>Buscador de CEP</h1>
        <input id="cep" type="text" placeholder="Digite o seu CEP (sem traço)">
        <br><br>
        <button onclick="buscarCEP()">Buscar CEP</button>
        <p id="texto"></p>

        <script src="JavaScript/scr.js"></script>

    </body>

</html>
